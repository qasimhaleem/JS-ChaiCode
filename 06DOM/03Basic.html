    <div>
        <button onclick="createDiv('LearnerCamp', 'green', '20px', 'white')">Click me to create Div</button>
    </div>
</body>
<script>
   function createDiv(title, color, padding, bgColor) {
    const div = document.createElement('div')
    const h1 = document.createElement('h1')
    console.log(div)
    div.className = "main"
    div.id = Math.floor((Math.random() * 10 + 1 ))
    div.setAttribute("title", title)
    div.style.backgroundColor = bgColor
    div.style.padding = padding
    div.style.color = color
    // div.innerText = "learnerCamp"
    const addText = document.createTextNode("LearnerCamp")
    div.appendChild(addText)
    document.body.appendChild(div)
}
